services:
  - type: web
    name: sugestion-data-driven-backend
    runtime: node
    rootDir: functions
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_API_KEY
        value: "true"
      - key: ALLOW_GLOBAL_JOBS
        value: "false"
      - key: MAX_UPLOAD_FILES_PER_RUN
        value: "10"
      - key: MAX_CSV_ROWS_PER_FILE
        value: "5000"
      - key: MAX_PRODUCTS_PER_ANALYTICS
        value: "5000"
      - key: MAX_STOCK_ROWS_PER_ANALYTICS
        value: "5000"
      - key: MAX_SALES_ROWS_PER_ANALYTICS
        value: "20000"
      - key: MAX_ITEMS_PER_INDICATOR
        value: "250"
      - key: OUTLIER_STD_DEV_FACTOR
        value: "3"
      - key: OUTLIER_MEDIAN_FACTOR
        value: "3"
      - key: TREND_MIN_FACTOR
        value: "0.75"
      - key: TREND_MAX_FACTOR
        value: "1.4"
      - key: TREND_CONFIRMATION_THRESHOLD
        value: "1.15"
      - key: SUGESTION_DATA_DRIVEN_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
  - type: cron
    name: sugestion-data-driven-import-cron
    runtime: node
    rootDir: functions
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: npm run cron:import-and-run
    envVars:
      - key: BACKEND_PUBLIC_URL
        value: https://sugestion-data-driven.onrender.com
      - key: CRON_EMPRESA_ID
        value: datadriven-4816c
      - key: SUGESTION_DATA_DRIVEN_API_KEY
        sync: false
